[package]
name = "data-exporter-configurator"
version.workspace = true
edition.workspace = true


[lib]
name = "configurator_lib"
path = "src/lib.rs"

[[bin]]
name = "configurator"
path = "src/main.rs"

[dependencies]
# Common library
common = { workspace = true }

# GUI Framework
native-windows-gui = { workspace = true }
native-windows-derive = { workspace = true }

# Async Runtime (for device flow)
tokio = { workspace = true }

# Error Handling
anyhow = { workspace = true }

# Configuration
toml = { workspace = true }
serde = { workspace = true }

# Glob pattern validation
globset = { workspace = true }

# Cron expression parsing for validation
cron = "0.15"

# Open URLs in default browser
open = "5"

[build-dependencies]
embed-resource = "3"
