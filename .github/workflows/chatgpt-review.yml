name: ChatGPT PR Review

on:
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ChatGPT Code Review
        uses: anc95/ChatGPT-CodeReview@v1.0.22
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_ENDPOINT: https://api.openai.com/v1
          MODEL: gpt-4o
          LANGUAGE: Russian
          top_p: 1
          temperature: 0.7
          max_tokens: 10000
          MAX_PATCH_LENGTH: 10000
          PROMPT: |
            Ты эксперт по Rust и Windows-разработке. Это проект data-exporter — Windows-сервис для:
            - Конвертации DBF файлов в CSV
            - Сжатия gzip и загрузки на облачный сервер
            - Работы как Windows Service с cron-расписанием
            - GUI конфигуратора на native-windows-gui

            Технологии: Rust 1.82.0, windows-service, reqwest, serde (TOML), native-windows-gui.

            Проверь код на:

            ## Rust Best Practices
            1. Memory safety и ownership — нет ли утечек, dangling references
            2. Идиоматичный Rust (clippy-подобные рекомендации)
            3. Правильное использование Result/Option, ? operator
            4. Избегание .unwrap() в production коде

            ## Windows-специфика
            5. Корректная работа с Windows путями (PathBuf, OsString)
            6. Жизненный цикл Windows Service (start, stop, pause)
            7. Права доступа и UAC considerations
            8. Кодировки (UTF-8, Windows-1251 для DBF)

            ## Безопасность
            9. Валидация входных данных (пути, URL, cron expressions)
            10. Безопасное хранение credentials (не в логах, не в plain text)
            11. SQL/Command injection prevention
            12. Proper TLS/certificate handling

            ## Производительность
            13. Эффективная работа с большими файлами (streaming, не загружать в память)
            14. Async/await корректность, избегание блокировок
            15. Оптимальное использование буферов

            ## Качество кода
            16. Консистентность с существующим стилем кода
            17. Достаточное логирование для отладки
            18. Понятные error messages для пользователя

            Формат ответа:
            - 🔴 **Критично**: проблемы безопасности или баги
            - 🟡 **Рекомендация**: улучшения качества кода
            - 🟢 **Хорошо**: отметь удачные решения

            Будь конкретен — указывай номера строк и предлагай исправления.

            ## Вердикт
            В конце обязательно дай чёткую рекомендацию по мержу:
            - ✅ **Можно мержить** — если нет критичных проблем
            - ⚠️ **Можно мержить с оговорками** — если есть minor issues, которые можно исправить позже
            - ❌ **Не мержить** — если есть критичные баги, проблемы безопасности или серьёзные архитектурные ошибки

            Кратко обоснуй своё решение.
