name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

jobs:
  claude-review:
    # Run on PR events or when someone comments "@claude" on a PR
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       contains(github.event.comment.body, '@claude'))

    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude PR Review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

          # Trigger settings
          trigger_phrase: "@claude"

          # Use sticky comment to consolidate feedback
          use_sticky_comment: true

          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request for the data-exporter project.

            This is a Rust Windows service application that:
            - Converts DBF files to CSV format
            - Compresses output with gzip
            - Uploads to a cloud server
            - Runs as a Windows service with cron-based scheduling
            - Has a native Windows GUI configurator

            Please focus your review on:
            1. Rust best practices and idiomatic code
            2. Windows-specific concerns (service lifecycle, paths, permissions)
            3. Error handling and proper Result propagation
            4. Security considerations (authentication, file access, input validation)
            5. Performance for large file processing
            6. Thread safety and async patterns
            7. Code style consistency with existing codebase

            Tech stack:
            - Rust stable (latest)
            - native-windows-gui for configurator UI
            - windows-service crate for Windows service management
            - reqwest for HTTP client
            - serde for TOML configuration

            IMPORTANT: Post your feedback as GitHub comments!
            - Use `gh pr comment` for top-level summary feedback
            - Use `mcp__github_inline_comment__create_inline_comment` to highlight specific code issues inline
            - Only post GitHub comments - don't submit review text as messages

            Be constructive, specific, and actionable in your feedback.
            Highlight both issues and good practices you observe.

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Glob,Grep"
