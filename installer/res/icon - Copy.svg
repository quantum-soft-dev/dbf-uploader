<?xml version="1.0" encoding="UTF-8"?>
<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="128" cy="128" r="120" fill="#2563eb" stroke="#1e40af" stroke-width="4"/>

  <!-- Database icon -->
  <g transform="translate(64, 60)">
    <!-- Top ellipse -->
    <ellipse cx="64" cy="20" rx="50" ry="15" fill="#60a5fa" stroke="#3b82f6" stroke-width="3"/>

    <!-- Middle section -->
    <rect x="14" y="20" width="100" height="70" fill="#3b82f6"/>
    <ellipse cx="64" cy="90" rx="50" ry="15" fill="#2563eb" stroke="#1e40af" stroke-width="3"/>

    <!-- Side lines -->
    <line x1="14" y1="20" x2="14" y2="90" stroke="#1e40af" stroke-width="3"/>
    <line x1="114" y1="20" x2="114" y2="90" stroke="#1e40af" stroke-width="3"/>

    <!-- Bottom ellipse -->
    <ellipse cx="64" cy="90" rx="50" ry="15" fill="#60a5fa" stroke="#3b82f6" stroke-width="3"/>
  </g>

  <!-- Arrow pointing right (export symbol) -->
  <g transform="translate(150, 100)">
    <path d="M 0 0 L 40 20 L 0 40 Z" fill="#fbbf24" stroke="#f59e0b" stroke-width="3"/>
    <rect x="15" y="15" width="35" height="10" fill="#fbbf24" stroke="#f59e0b" stroke-width="2"/>
  </g>

  <!-- Text "DBF" -->
  <text x="128" y="210" font-family="Arial, sans-serif" font-size="36" font-weight="bold" text-anchor="middle" fill="white">DBF</text>
</svg>
