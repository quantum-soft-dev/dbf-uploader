[workspace]
members = [
    "common",
    "service",
    "configurator",
]
resolver = "2"

[workspace.package]
version = "1.0.0"
edition = "2021"
rust-version = "1.82.0"

[workspace.dependencies]
# Common library
common = { path = "common" }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# HTTP Client
reqwest = { version = "0.12", features = ["native-tls", "multipart", "json"], default-features = false }

# Error Handling
thiserror = "1"
anyhow = "1"

# Async Runtime
tokio = { version = "1", features = ["full"] }

# DateTime
chrono = { version = "0.4", features = ["serde"] }

# UUID
uuid = { version = "1", features = ["v4", "serde"] }

# Base64 for Basic Auth
base64 = "0.22"

# GUI Framework
native-windows-gui = "1.0"
native-windows-derive = "1.0"

# Windows Service
windows-service = "0.7"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# Scheduling
tokio-cron-scheduler = "0.13"

# DBF Parsing
dbase = { version = "0.5", features = ["yore"] }

# CSV Writing
csv = "1"

# Compression
flate2 = "1"

# File Watching
notify-debouncer-mini = "0.4"

# Encoding
encoding_rs = "0.8"

# VSS (Volume Shadow Copy Service)
rawcopy-rs = "0.1"

# File pattern matching
globset = "0.4.15"

# Windows API (for shortcuts creation)
windows = { version = "0.58", features = [
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_Foundation",
    "Win32_System_Ole",
] }

# Testing dependencies
wiremock = "0.6"
tempfile = "3"
tokio-test = "0.4"
